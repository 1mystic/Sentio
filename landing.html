<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Veramind — Find Your Calm</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --plum: #352b38;
  --slate: #7e808c;
  --lavender: #dad8f9;
  --ghost: #f4f3f8;
  --lavender-mid: #b8b4f0;
  --lavender-deep: #9b94e8;
  --lavender-soft: #eceaf9;
  --bg: #edeaf4;
  --white: #ffffff;
}
html { scroll-behavior: smooth; }
body {
  font-family: 'Urbanist', sans-serif;
  background: var(--bg);
  color: var(--plum);
  overflow-x: hidden;
}
/* ── Navbar ── */
.navbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; padding: 0 48px;
  height: 68px;
  background: rgba(244,243,248,0.75);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(218,216,249,0.4);
  transition: background 0.3s;
}
.nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.nav-logo-mark {
  width: 38px; height: 38px; border-radius: 11px;
  background: linear-gradient(135deg, #dad8f9 0%, #9b94e8 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 19px; font-weight: 900; color: var(--plum); letter-spacing: -1px;
}
.nav-logo-text { font-size: 20px; font-weight: 800; color: var(--plum); letter-spacing: -0.5px; }
.nav-links { display: flex; align-items: center; gap: 6px; margin-left: 40px; }
.nav-link {
  padding: 7px 14px; border-radius: 8px; font-size: 14px; font-weight: 500;
  color: var(--slate); text-decoration: none; transition: all 0.15s;
}
.nav-link:hover { color: var(--plum); background: var(--lavender-soft); }
.nav-spacer { flex: 1; }
.nav-ctas { display: flex; align-items: center; gap: 10px; }
.btn { display: inline-flex; align-items: center; gap: 6px; font-family: 'Urbanist', sans-serif; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; text-decoration: none; }
.btn-ghost-nav { padding: 8px 18px; border-radius: 10px; font-size: 14px; background: transparent; color: var(--plum); border: 1.5px solid var(--lavender); }
.btn-ghost-nav:hover { background: var(--lavender-soft); }
.btn-primary { padding: 9px 22px; border-radius: 10px; font-size: 14px; background: var(--plum); color: white; }
.btn-primary:hover { background: #4a3550; box-shadow: 0 4px 16px rgba(53,43,56,0.22); transform: translateY(-1px); }
.btn-hero { padding: 15px 36px; border-radius: 14px; font-size: 17px; font-weight: 700; background: var(--plum); color: white; }
.btn-hero:hover { background: #4a3550; box-shadow: 0 8px 32px rgba(53,43,56,0.28); transform: translateY(-2px); }
.btn-hero-outline { padding: 15px 36px; border-radius: 14px; font-size: 17px; font-weight: 700; background: transparent; color: var(--plum); border: 2px solid var(--lavender-mid); }
.btn-hero-outline:hover { background: var(--lavender-soft); border-color: var(--lavender-deep); }
.btn-pill { border-radius: 99px !important; }

/* ── Hero ── */
.hero {
  min-height: 100vh;
  padding-top: 68px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.hero-bg {
  position: absolute; inset: 0; z-index: 0;
  background: linear-gradient(160deg, #f4f3f8 0%, #edeaf4 35%, #e4e1f5 65%, #dbd6f5 100%);
}
/* Floating orbs */
.orb {
  position: absolute; border-radius: 50%;
  background: radial-gradient(circle, rgba(155,148,232,0.22), rgba(218,216,249,0.08));
  pointer-events: none;
}
.orb-1 { width: 600px; height: 600px; top: -150px; right: -100px; }
.orb-2 { width: 400px; height: 400px; bottom: -80px; left: -80px; background: radial-gradient(circle, rgba(218,216,249,0.3), transparent); }
.orb-3 { width: 200px; height: 200px; top: 40%; left: 20%; }
/* Decorative mandala SVG */
.mandala-bg {
  position: absolute; opacity: 0.06; z-index: 0;
  top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 700px; height: 700px;
}
.hero-inner {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; align-items: center;
  text-align: center; padding: 0 24px;
  max-width: 860px;
}
.hero-pill {
  display: inline-flex; align-items: center; gap: 8px;
  background: white; border: 1.5px solid var(--lavender);
  border-radius: 99px; padding: 7px 16px; font-size: 13px;
  font-weight: 600; color: var(--lavender-deep);
  margin-bottom: 28px; box-shadow: 0 2px 12px rgba(155,148,232,0.12);
}
.hero-pill-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--lavender-deep); }
.hero-title {
  font-size: clamp(44px, 7vw, 80px);
  font-weight: 900; line-height: 1.05;
  letter-spacing: -2.5px; color: var(--plum);
  margin-bottom: 20px;
  text-wrap: balance;
}
.hero-title .accent {
  background: linear-gradient(135deg, #9b94e8 0%, #b8b4f0 50%, #352b38 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hero-sub {
  font-size: 18px; font-weight: 400; color: var(--slate);
  line-height: 1.65; max-width: 580px; margin-bottom: 36px;
  text-wrap: pretty;
}
.hero-ctas { display: flex; gap: 12px; align-items: center; margin-bottom: 48px; flex-wrap: wrap; justify-content: center; }
.hero-social-proof { display: flex; align-items: center; gap: 14px; }
.avatar-stack { display: flex; }
.avatar-stack-item {
  width: 32px; height: 32px; border-radius: 50%; border: 2px solid white;
  background: linear-gradient(135deg, var(--lavender), var(--lavender-deep));
  margin-left: -8px; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: var(--plum);
}
.avatar-stack-item:first-child { margin-left: 0; }
.social-proof-text { font-size: 13px; color: var(--slate); }
.social-proof-text strong { color: var(--plum); }

/* ── Dashboard Preview ── */
.dashboard-preview {
  position: relative; z-index: 2; width: 100%;
  max-width: 1080px; margin: 0 auto;
  padding: 0 24px 80px;
}
.preview-frame {
  background: white; border-radius: 24px;
  box-shadow: 0 32px 80px rgba(53,43,56,0.16), 0 2px 8px rgba(53,43,56,0.06);
  overflow: hidden;
  border: 1px solid rgba(218,216,249,0.5);
}
.preview-topbar {
  display: flex; align-items: center; gap: 6px;
  padding: 14px 20px;
  background: var(--ghost);
  border-bottom: 1px solid var(--lavender-soft);
}
.preview-dot { width: 10px; height: 10px; border-radius: 50%; }
.preview-url {
  flex: 1; height: 26px; background: white; border-radius: 6px;
  margin: 0 12px; display: flex; align-items: center; padding: 0 10px;
  font-size: 11px; color: var(--slate); border: 1px solid var(--lavender-soft);
}
.preview-body { display: flex; height: 500px; }
.preview-sidebar {
  width: 56px; background: var(--ghost); border-right: 1px solid var(--lavender-soft);
  display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 10px;
}
.preview-nav-icon {
  width: 32px; height: 32px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; cursor: pointer; transition: background 0.15s;
}
.preview-nav-icon.active { background: var(--lavender); }
.preview-main { flex: 1; padding: 20px; overflow: hidden; background: var(--ghost); }
.preview-header-bar { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
.preview-greeting { font-size: 17px; font-weight: 800; }
.preview-sub { font-size: 11px; color: var(--slate); }
.preview-search {
  display: flex; align-items: center; gap: 6px;
  background: white; border: 1px solid var(--lavender); border-radius: 8px;
  padding: 6px 10px; font-size: 11px; color: var(--slate); width: 160px;
}
.preview-cards { display: grid; grid-template-columns: repeat(3, 1fr) 200px; gap: 10px; margin-bottom: 10px; height: 165px; }
.preview-stat {
  background: white; border-radius: 12px; padding: 12px;
  box-shadow: 0 2px 10px rgba(53,43,56,0.06);
}
.preview-stat.lavender { background: linear-gradient(135deg, #dad8f9, #eceaf9); }
.preview-stat.pink { background: linear-gradient(135deg, #f9d8f0, #fde8f9); }
.preview-stat.blue { background: linear-gradient(135deg, #d8edf9, #e8f4fd); }
.preview-stat-label { font-size: 9px; font-weight: 600; color: var(--slate); text-transform: uppercase; letter-spacing: 0.4px; }
.preview-stat-val { font-size: 24px; font-weight: 800; margin: 4px 0 2px; }
.preview-stat-change { font-size: 9px; font-weight: 700; color: #059669; }
.mini-bars { display: flex; align-items: flex-end; gap: 2px; height: 40px; margin-top: 6px; }
.mini-bar { flex: 1; border-radius: 2px 2px 0 0; }
.preview-side { display: flex; flex-direction: column; gap: 10px; }
.preview-insight { background: white; border-radius: 12px; padding: 12px; box-shadow: 0 2px 10px rgba(53,43,56,0.06); flex: 1; }
.preview-insight-title { font-size: 11px; font-weight: 700; margin-bottom: 8px; }
.preview-pl-item { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.preview-pl-icon { width: 18px; height: 18px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; }
.preview-pl-name { font-size: 10px; flex: 1; }
.preview-pl-pct { font-size: 10px; font-weight: 700; color: var(--slate); }
.preview-pl-bar { height: 3px; background: var(--lavender-soft); border-radius: 99px; margin-top: 2px; overflow: hidden; }
.preview-pl-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--lavender-deep), var(--lavender-mid)); }
.preview-pipeline { background: white; border-radius: 12px; padding: 12px; box-shadow: 0 2px 10px rgba(53,43,56,0.06); margin-top: 10px; }
.preview-pipeline-title { font-size: 11px; font-weight: 700; margin-bottom: 8px; }
.p-row { display: grid; grid-template-columns: 90px repeat(5, 1fr); gap: 4px; margin-bottom: 4px; }
.p-label { font-size: 9px; color: var(--slate); display: flex; align-items: center; }
.p-cell { border-radius: 5px; padding: 4px; font-size: 10px; font-weight: 700; text-align: center; }
.preview-users { background: white; border-radius: 12px; padding: 12px; box-shadow: 0 2px 10px rgba(53,43,56,0.06); }
.preview-users-title { font-size: 11px; font-weight: 700; margin-bottom: 8px; }
.prev-user { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.prev-avatar { width: 24px; height: 24px; border-radius: 8px; background: linear-gradient(135deg, var(--lavender), var(--lavender-deep)); display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; }
.prev-info { flex: 1; }
.prev-name { font-size: 10px; font-weight: 600; }
.prev-email { font-size: 9px; color: var(--slate); }

/* ── Sections ── */
.section { padding: 96px 48px; max-width: 1200px; margin: 0 auto; }
.section-label {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
  color: var(--lavender-deep); background: var(--lavender-soft);
  border: 1px solid var(--lavender); border-radius: 99px; padding: 5px 14px;
  margin-bottom: 18px;
}
.section-title { font-size: clamp(30px, 4vw, 48px); font-weight: 800; letter-spacing: -1.5px; line-height: 1.1; color: var(--plum); margin-bottom: 16px; text-wrap: balance; }
.section-sub { font-size: 17px; color: var(--slate); line-height: 1.65; max-width: 540px; text-wrap: pretty; }

/* Features grid */
.features-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 52px; }
.feature-card {
  background: white; border-radius: 20px; padding: 28px;
  box-shadow: 0 4px 24px rgba(53,43,56,0.06);
  border: 1px solid rgba(218,216,249,0.4);
  transition: all 0.2s;
}
.feature-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(53,43,56,0.12); }
.feature-icon {
  width: 52px; height: 52px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; margin-bottom: 16px;
}
.feature-name { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
.feature-desc { font-size: 14px; color: var(--slate); line-height: 1.6; }

/* Stats row */
.stats-row {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px;
  background: var(--lavender-soft); border-radius: 20px; overflow: hidden;
  margin-top: 52px;
}
.stat-block { background: white; padding: 36px 28px; text-align: center; }
.stat-num { font-size: 48px; font-weight: 900; letter-spacing: -2px; background: linear-gradient(135deg, var(--plum), var(--lavender-deep)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.stat-lbl { font-size: 14px; color: var(--slate); margin-top: 4px; }

/* Testimonials */
.testimonials-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 52px; }
.testimonial-card {
  background: white; border-radius: 20px; padding: 28px;
  box-shadow: 0 4px 24px rgba(53,43,56,0.06);
  border: 1px solid rgba(218,216,249,0.4);
}
.testimonial-stars { display: flex; gap: 3px; margin-bottom: 14px; }
.testimonial-star { color: #fbbf24; font-size: 16px; }
.testimonial-text { font-size: 14px; color: var(--slate); line-height: 1.7; margin-bottom: 18px; font-style: italic; }
.testimonial-author { display: flex; align-items: center; gap: 10px; }
.testimonial-avatar {
  width: 38px; height: 38px; border-radius: 12px;
  background: linear-gradient(135deg, var(--lavender), var(--lavender-deep));
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700;
}
.testimonial-name { font-size: 14px; font-weight: 700; }
.testimonial-role { font-size: 12px; color: var(--slate); }

/* Pricing */
.pricing-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 52px; }
.pricing-card {
  background: white; border-radius: 24px; padding: 32px;
  box-shadow: 0 4px 24px rgba(53,43,56,0.06);
  border: 2px solid transparent;
  position: relative; transition: all 0.2s;
}
.pricing-card.featured {
  background: var(--plum); border-color: var(--plum);
}
.pricing-card.featured * { color: white !important; }
.pricing-card.featured .pricing-feature-icon { background: rgba(255,255,255,0.1) !important; }
.pricing-label { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--slate); margin-bottom: 12px; }
.pricing-label.featured-lbl { color: var(--lavender-mid) !important; }
.pricing-price { font-size: 52px; font-weight: 900; letter-spacing: -2px; line-height: 1; }
.pricing-price sub { font-size: 18px; font-weight: 600; vertical-align: baseline; letter-spacing: 0; }
.pricing-price sup { font-size: 22px; font-weight: 700; vertical-align: top; margin-top: 8px; display: inline-block; letter-spacing: 0; }
.pricing-period { font-size: 13px; color: var(--slate); margin-top: 4px; margin-bottom: 24px; }
.pricing-features { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
.pricing-feature { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.pricing-feature-icon { width: 20px; height: 20px; border-radius: 6px; background: var(--lavender-soft); display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; }
.pricing-badge {
  position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
  background: linear-gradient(90deg, var(--lavender-deep), var(--lavender-mid));
  color: white; font-size: 11px; font-weight: 700; padding: 4px 14px; border-radius: 99px;
  white-space: nowrap;
}
.btn-pricing-dark { width: 100%; padding: 13px; border-radius: 12px; font-size: 15px; font-weight: 700; background: var(--plum); color: white; border: none; cursor: pointer; transition: all 0.2s; font-family: 'Urbanist', sans-serif; }
.btn-pricing-dark:hover { background: #4a3550; transform: translateY(-1px); }
.btn-pricing-outline { width: 100%; padding: 13px; border-radius: 12px; font-size: 15px; font-weight: 700; background: transparent; color: white; border: 2px solid rgba(255,255,255,0.3); cursor: pointer; transition: all 0.2s; font-family: 'Urbanist', sans-serif; }
.btn-pricing-outline:hover { background: rgba(255,255,255,0.1); }
.btn-pricing-ghost { width: 100%; padding: 13px; border-radius: 12px; font-size: 15px; font-weight: 700; background: transparent; color: var(--plum); border: 2px solid var(--lavender-mid); cursor: pointer; transition: all 0.2s; font-family: 'Urbanist', sans-serif; }
.btn-pricing-ghost:hover { background: var(--lavender-soft); }

/* CTA section */
.cta-section {
  margin: 0 48px 80px;
  background: linear-gradient(135deg, var(--plum) 0%, #4a3550 100%);
  border-radius: 28px; padding: 72px 48px;
  text-align: center; position: relative; overflow: hidden;
}
.cta-orb {
  position: absolute; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(218,216,249,0.12), transparent);
}
.cta-orb-1 { width: 400px; height: 400px; top: -150px; right: -80px; }
.cta-orb-2 { width: 300px; height: 300px; bottom: -120px; left: -60px; }
.cta-title { font-size: clamp(32px, 4vw, 52px); font-weight: 900; color: white; letter-spacing: -2px; margin-bottom: 16px; text-wrap: balance; }
.cta-sub { font-size: 17px; color: rgba(218,216,249,0.7); margin-bottom: 36px; line-height: 1.6; }
.cta-ctas { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.btn-cta-white { padding: 15px 36px; border-radius: 14px; font-size: 16px; font-weight: 700; background: white; color: var(--plum); border: none; cursor: pointer; transition: all 0.2s; font-family: 'Urbanist', sans-serif; }
.btn-cta-white:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,0,0,0.2); }
.btn-cta-outline { padding: 15px 36px; border-radius: 14px; font-size: 16px; font-weight: 700; background: transparent; color: white; border: 2px solid rgba(255,255,255,0.3); cursor: pointer; transition: all 0.2s; font-family: 'Urbanist', sans-serif; }
.btn-cta-outline:hover { background: rgba(255,255,255,0.08); }

/* Footer */
.footer { background: var(--plum); padding: 60px 48px 36px; }
.footer-top { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 40px; margin-bottom: 52px; }
.footer-brand {}
.footer-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.footer-logo-mark { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, rgba(218,216,249,0.2), rgba(155,148,232,0.3)); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900; color: white; }
.footer-logo-text { font-size: 20px; font-weight: 800; color: white; }
.footer-tagline { font-size: 14px; color: rgba(218,216,249,0.5); line-height: 1.6; max-width: 240px; }
.footer-col-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: rgba(218,216,249,0.5); margin-bottom: 16px; }
.footer-link { display: block; font-size: 14px; color: rgba(218,216,249,0.7); text-decoration: none; margin-bottom: 10px; transition: color 0.15s; }
.footer-link:hover { color: white; }
.footer-bottom { display: flex; align-items: center; justify-content: space-between; padding-top: 28px; border-top: 1px solid rgba(218,216,249,0.1); }
.footer-copy { font-size: 13px; color: rgba(218,216,249,0.4); }
.footer-socials { display: flex; gap: 10px; }
.footer-social { width: 34px; height: 34px; border-radius: 9px; background: rgba(218,216,249,0.1); display: flex; align-items: center; justify-content: center; font-size: 14px; color: rgba(218,216,249,0.6); cursor: pointer; transition: all 0.15s; text-decoration: none; }
.footer-social:hover { background: rgba(218,216,249,0.18); color: white; }

/* How it works */
.how-bg { background: white; }
.how-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 52px; position: relative; }
.how-steps::before { content: ''; position: absolute; top: 28px; left: 10%; right: 10%; height: 2px; background: linear-gradient(90deg, var(--lavender-soft), var(--lavender), var(--lavender-soft)); z-index: 0; }
.how-step { position: relative; z-index: 1; text-align: center; padding: 0 12px; }
